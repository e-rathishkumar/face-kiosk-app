name: siddhan_logs_kiosk
description: Siddhan Employee Logs - Edge AI Face Attendance Kiosk
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera & ML
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.12.0

  # Network
  dio: ^5.7.0

  # Local Database
  sqflite: ^2.4.1
  path: ^1.9.0

  # Storage & Security
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4

  # UI
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1

  # TTS
  flutter_tts: ^4.2.5

  # Utils
  uuid: ^4.5.1
  connectivity_plus: ^6.1.1
  intl: ^0.19.0
  path_provider: ^2.1.5
  model_viewer_plus: ^1.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
